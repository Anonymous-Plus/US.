<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<title>US. · A little world for two</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="intro" hidden>
  <section class="step"><h1 class="mark serif" aria-label="US."><svg class="heart-logo mark-heart" viewBox="0 0 48 44" aria-hidden="true"><path d="M24 40S4 28 4 14C4 7 9 3 15 3c4 0 7 2 9 6 2-4 5-6 9-6 6 0 11 4 11 11 0 14-20 26-20 26Z"/></svg></h1><p class="serif it tag">A little world for two.</p><button class="btn" id="go0">COMEÇAR</button></section>
  <section class="step"><h2 class="serif h2">Duas pessoas. Um espaço.</h2><button class="btn" data-next>CRIAR O NOSSO ESPAÇO</button><button class="ghost" id="jn">JÁ TENHO UM CÓDIGO</button></section>
  <section class="step"><h2 class="serif h2">Quem és?</h2>
    <label class="fld">Pessoa 01<input id="n1" maxlength="20" autocomplete="off" placeholder="O teu nome"></label>
    <label class="fld">O teu e-mail<input id="e1" type="email" autocomplete="email" placeholder="tu@exemplo.com"></label>
    <label class="fld" id="f2" hidden>Pessoa 02<input id="n2" maxlength="20" autocomplete="off" placeholder="O nome dela ou dele"><input id="e2" type="email" autocomplete="email" placeholder="E-mail dela ou dele"></label>
    <button class="btn" id="b1" data-next disabled>CONTINUAR</button></section>
  <section class="step"><h2 class="serif h2">Cria o vosso espaço.</h2>
    <label class="fld">Nome do espaço<input id="sn" maxlength="24" autocomplete="off" placeholder="Dev &amp; Ana"></label>
    <label class="fld">Desde quando (opcional)<input id="sd" type="date"></label>
    <button class="btn" data-next>CONTINUAR</button></section>
  <section class="step"><h2 class="serif h2">Este espaço pertence apenas a vocês.</h2><button class="btn" id="enter">ENTRAR NO NOSSO MUNDO</button></section>
  <section class="step"><h2 class="serif h2">Entra no vosso espaço.</h2><label class="fld">Código<input id="jc" maxlength="16" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX"></label><button class="btn" id="jb">PROCURAR</button><div id="jw" class="row"></div></section>
  <section class="step"><h2 class="serif h2">Enviem este código à outra pessoa.</h2><p class="serif" id="cd" style="font-size:clamp(2rem,9vw,3.4rem);letter-spacing:.04em"></p><p class="mute">Só quem tiver o código entra. Guardem-no.</p><div class="row"><button class="btn" data-a="share">PARTILHAR CONVITE</button><button class="ghost" id="go2">ENTRAR</button></div></section>
</div>

<div id="app" hidden>
  <nav class="nav" aria-label="Principal">
    <button data-v="home">Home</button><button data-v="missoes">Missões</button><button data-v="xp">XP</button><button data-v="marcos">Marcos</button><button data-v="espaco">Espaço</button>
  </nav>
  <main>
    <header class="top"><button class="brand serif" id="logo" aria-label="US."><svg class="heart-logo brand-heart" viewBox="0 0 48 44" aria-hidden="true"><path d="M24 40S4 28 4 14C4 7 9 3 15 3c4 0 7 2 9 6 2-4 5-6 9-6 6 0 11 4 11 11 0 14-20 26-20 26Z"/></svg></button><span id="sp" class="serif it"></span></header>
    <section class="view" id="v-home" aria-label="Home"></section>
    <section class="view" id="v-missoes" aria-label="Missões"></section>
    <section class="view" id="v-xp" aria-label="XP"></section>
    <section class="view" id="v-marcos" aria-label="Marcos"></section>
    <section class="view" id="v-espaco" aria-label="Nosso espaço"></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="sh"><div class="sheet" id="sheet"></div></dialog>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-live="polite" tabindex="-1"></div>
<div class="toast" id="toast" role="status"></div>
<div class="cur" id="cur" aria-hidden="true"></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
